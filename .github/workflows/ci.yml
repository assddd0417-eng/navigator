name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 마이그레이션 적용 + 재실행 멱등성 확인
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/navigator_ci
        run: |
          psql "$ADMIN_URL" -c "CREATE DATABASE navigator_ci"
          ./scripts/migrate.sh
          ./scripts/migrate.sh | tee rerun.log
          ! grep -q "적용:" rerun.log

      - name: SQL 스모크 테스트
        run: psql "postgresql://postgres:postgres@localhost:5432/navigator_ci" -X -v ON_ERROR_STOP=1 -f db/tests/smoke_test.sql

      - name: 백엔드 의존성 설치
        run: pip install -e "backend[dev,llm]"

      - name: 백엔드 테스트 (pytest)
        working-directory: backend
        env:
          TEST_ADMIN_DATABASE_URL: ${{ env.ADMIN_URL }}
        run: pytest -v

      - name: 시드 적용 (2회, 재실행 안전 확인) + API 스모크 테스트 (curl)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/navigator_ci
          COLLECT_AUTO_MINUTES: "0"
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f seeds/base.sql
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f seeds/base.sql
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f seeds/navigator_companies.sql
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f seeds/navigator_companies.sql
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f seeds/navigator_announcements.sql
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f seeds/navigator_announcements.sql
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f seeds/navigator_past_announcements.sql
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f seeds/navigator_past_announcements.sql
          (cd backend && uvicorn app.main:app --port 8000 > ../uvicorn.log 2>&1 &)
          for i in $(seq 30); do curl -sf http://localhost:8000/health >/dev/null && break; sleep 1; done
          ./scripts/smoke_test.sh || { cat uvicorn.log; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: 타입 검사 + 빌드
        run: npm run build

  demo-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: navigator_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: 시연 이미지 빌드
        run: docker build -t navigator-demo .

      - name: 시연 이미지 실행 (비밀번호 확인)
        run: |
          docker run -d --name demo --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/navigator_demo \
            -e SITE_PASSWORD=ci-pass -e PORT=8100 navigator-demo
          for i in $(seq 60); do curl -sf http://localhost:8100/api/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8100/api/health || { docker logs demo; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8100/navigator)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u navigator:ci-pass http://localhost:8100/navigator)" = 200
          curl -sf -u navigator:ci-pass http://localhost:8100/api/navigator/announcements | grep -q '가상'
