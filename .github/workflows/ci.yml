name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 마이그레이션 적용 + 재실행 멱등성 확인
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relay_ax_ci
        run: |
          psql "$ADMIN_URL" -c "CREATE DATABASE relay_ax_ci"
          ./scripts/migrate.sh
          ./scripts/migrate.sh | tee rerun.log
          ! grep -q "적용:" rerun.log

      - name: SQL 스모크 테스트
        run: psql "postgresql://postgres:postgres@localhost:5432/relay_ax_ci" -X -v ON_ERROR_STOP=1 -f db/tests/smoke_test.sql

      - name: 백엔드 의존성 설치
        run: pip install -e "backend[dev,llm]"

      - name: 백엔드 테스트 (pytest)
        working-directory: backend
        env:
          TEST_ADMIN_DATABASE_URL: ${{ env.ADMIN_URL }}
        run: pytest -v

      - name: 시드 적용 (2회, 재실행 안전 확인) + API 스모크 테스트 (curl)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relay_ax_ci
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f seeds/init_test_data.sql
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f seeds/init_test_data.sql
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f seeds/navigator_companies.sql
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f seeds/navigator_companies.sql
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f seeds/navigator_announcements.sql
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f seeds/navigator_announcements.sql
          (cd backend && uvicorn app.main:app --port 8000 > ../uvicorn.log 2>&1 &)
          for i in $(seq 30); do curl -sf http://localhost:8000/health >/dev/null && break; sleep 1; done
          ./scripts/smoke_test.sh || { cat uvicorn.log; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: 타입 검사 + 빌드
        run: npm run build
