[project]
name = "relay-ax-backend"
version = "0.1.0"
description = "국방 R&D 성과연계·이어달리기 AX PoC 백엔드 (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
# BGE-M3 임베더 사용 시 (폐쇄망은 모델 파일을 사전 반입 후 EMBEDDING_MODEL_PATH 지정)
# torch 2.2+ = Apple Silicon MPS 지원. macOS arm64 는 PyPI 기본 휠이 MPS 를 포함한다.
bge = ["sentence-transformers>=3.0", "torch>=2.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
