# /etc/nginx/conf.d/navigator.conf
# 기업 화면은 누구나, 기관 담당자 화면·API 는 아이디/비밀번호(/etc/nginx/navigator.htpasswd)를 물어본다.
# 담당자 API 요청은 X-User-Id 헤더가 붙으므로 그 헤더가 있으면 비밀번호를 요구한다.
map $http_x_user_id $navigator_staff_auth {
    ""      off;
    default "Navigator 기관 담당자";
}

server {
    listen 80;
    server_name _;                      # 내부 도메인이 있으면 적는다 (예: navigator.krit.local)

    client_max_body_size 35m;           # 공고문 업로드 (UPLOAD_MAX_MB=30 보다 조금 크게)
    proxy_read_timeout 300s;            # 공고문 읽기·매칭이 길어질 때

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /login {
        auth_basic "Navigator 기관 담당자";
        auth_basic_user_file /etc/nginx/navigator.htpasswd;
        proxy_pass http://127.0.0.1:8000;
    }
    location /staff/ {
        auth_basic "Navigator 기관 담당자";
        auth_basic_user_file /etc/nginx/navigator.htpasswd;
        proxy_pass http://127.0.0.1:8000;
    }
    location /api/ {
        auth_basic $navigator_staff_auth;
        auth_basic_user_file /etc/nginx/navigator.htpasswd;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
