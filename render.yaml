# 시연 주소 (Render 무료). 사용법은 docs/demo_link.md
services:
  - type: web
    name: navigator-demo
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: navigator-demo-db
          property: connectionString
      - key: SITE_USER
        value: navigator
      - key: SITE_PASSWORD
        sync: false
databases:
  - name: navigator-demo-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
